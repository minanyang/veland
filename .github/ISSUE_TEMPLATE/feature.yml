name: Feature request
description: A need the plugin does not meet yet
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The need, and who has it.
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed behaviour
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: One checkable line per criterion, numbered AC1, AC2, …
      placeholder: |
        - [ ] AC1 — …
        - [ ] AC2 — …
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
    validations:
      required: false
