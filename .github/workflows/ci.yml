name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install shellcheck
        run: command -v shellcheck >/dev/null || brew install shellcheck
      - name: Install the claude CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.300
      - name: Gates
        run: scripts/ci-gates.sh "${{ github.event.pull_request.base.sha }}"
