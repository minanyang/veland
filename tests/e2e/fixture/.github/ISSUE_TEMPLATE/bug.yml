name: Bug report
description: Something does not work as it should
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for the report.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What happens today and where
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
    validations:
      required: true
